# DATA-API.yaml
#
# ВАЖНО (проверить перед сдачей): организаторы хакатона просят файл "DATA-API.yaml по заданной
# структуре", но точный образец/шаблон в разобранном тексте кейса не был приведён дословно —
# только перечень обязательных полей (версия схемы, идентификатор команды, базовый адрес,
# обязательные проверки, HTTP-методы, параметры, роли, статус-коды, формат ответа), см.
# docs/ТЗ — Ассистент сезонного найма (MAX).md, раздел 11. Ниже — состав на основе этого
# перечня. Если организаторы прикладывали отдельный файл-шаблон/пример DATA-API.yaml к кейсу —
# сверьте ключи и вложенность с ним и поправьте при необходимости.

schema_version: "1.0"

team:
  # TODO: вписать реальный идентификатор/название команды перед сдачей
  id: "REPLACE_WITH_TEAM_ID"
  name: "REPLACE_WITH_TEAM_NAME"

api:
  # TODO: вписать реальный HTTPS-адрес backend на время проверки жюри
  base_url: "https://REPLACE_WITH_PUBLIC_HTTPS_URL"
  spec: "./openapi.yaml"

  health_check:
    method: GET
    path: /health
    expected_status: 200

  auth:
    type: bearer
    note: >
      Authorization: Bearer <token>. Токен — либо сессия мини-приложения, выданная через
      POST /api/auth/max (проверка подписи initData MAX HMAC-SHA256, см. раздел 12 ТЗ), либо
      фиксированный TEST_API_TOKEN из backend/.env — для проверки жюри без реального MAX-логина.
      GET /health и GET /api/benchmark авторизации не требуют. Работодатель/кандидат определяются
      по токену, а не по полям тела запроса (см. endpoints ниже).

  roles:
    - name: employer
      description: Работодатель — создаёт и публикует вакансии, видит отклики и меняет их статус
      entry_point: "личный чат с ботом (/новая_вакансия) или мини-приложение, авторизованное через /api/auth/max"
    - name: candidate
      description: Кандидат — откликается на вакансию по кнопке/deep link в карточке, либо через мини-приложение
      entry_point: "кнопка «Откликнуться» на карточке вакансии в MAX, либо POST /api/applications из мини-приложения"

  endpoints:
    - method: POST
      path: /api/auth/max
      role: public
      auth: none
      params:
        - name: init_data
          in: body
          required: true
          type: string
      responses:
        "200": "{ token, user_id }"
        "400": "validation error"
        "401": "invalid or expired initData signature"

    - method: GET
      path: /api/vacancies
      role: employer
      auth: bearer
      params: []
      responses:
        "200": "array of Vacancy (only caller's own)"
        "401": "unauthorized"

    - method: POST
      path: /api/vacancies
      role: employer
      auth: bearer
      params:
        - name: title
          in: body
          required: true
          type: string
      responses:
        "201": "Vacancy"
        "400": "validation error"
        "401": "unauthorized"

    - method: GET
      path: /api/vacancies/{id}
      role: employer
      auth: bearer
      params:
        - name: id
          in: path
          required: true
          type: integer
      responses:
        "200": "Vacancy"
        "401": "unauthorized"
        "403": "not owner"
        "404": "not found"

    - method: POST
      path: /api/vacancies/{id}/publish
      role: employer
      auth: bearer
      params:
        - name: id
          in: path
          required: true
          type: integer
      responses:
        "200": "Vacancy"
        "401": "unauthorized"
        "403": "not owner"
        "404": "not found"
        "409": "already published or closed"
        "502": "failed to deliver card to MAX, rolled back to draft"

    - method: POST
      path: /api/vacancies/{id}/close
      role: employer
      auth: bearer
      params:
        - name: id
          in: path
          required: true
          type: integer
      responses:
        "200": "Vacancy"
        "401": "unauthorized"
        "403": "not owner"
        "404": "not found"

    - method: GET
      path: /api/vacancies/{id}/applications
      role: employer
      auth: bearer
      params:
        - name: id
          in: path
          required: true
          type: integer
      responses:
        "200": "array of Application"
        "401": "unauthorized"
        "403": "not owner"
        "404": "not found"

    - method: POST
      path: /api/applications
      role: candidate
      auth: bearer
      params:
        - name: vacancy_id
          in: body
          required: true
          type: integer
        - name: contact
          in: body
          required: false
          type: string
      responses:
        "201": "Application (with notified: boolean)"
        "400": "validation error"
        "401": "unauthorized"
        "404": "vacancy not found"
        "409": "vacancy not published, or duplicate application"

    - method: PATCH
      path: /api/applications/{id}
      role: employer
      auth: bearer
      params:
        - name: id
          in: path
          required: true
          type: integer
        - name: status
          in: body
          required: true
          type: string
          enum: [new, contacted, invited, hired, rejected]
      responses:
        "200": "Application (with notified: boolean)"
        "401": "unauthorized"
        "403": "not owner"
        "404": "not found"

    - method: GET
      path: /api/benchmark
      role: public
      auth: none
      params:
        - name: region_code
          in: query
          required: true
          type: string
        - name: category
          in: query
          required: true
          type: string
      responses:
        "200": "Benchmark"
        "400": "validation error"
        "404": "no data"

  response_format:
    content_type: application/json
    error_shape:
      error: string
      details: "optional, present on 400 validation errors (zod error tree)"

test_data:
  # TODO: положить тестовые данные (JSON/CSV) перед сдачей — см. раздел 11 ТЗ
  path: "./test-data/"

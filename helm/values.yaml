global:
  registry: 0f0c1e4e-honest-aquila.registry.twcstorage.ru

nameOverride: ""
fullnameOverride: ""

imagePullSecrets:
  - name: my-private-registry

frontend:
  fullnameOverride: ""
  replicaCount: 1
  image:
    repository: agile-manifest-project/frontend
    tag: latest
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 80
  nodeSelector:
    kubernetes.io/hostname: test-schedule-semenov-02.hpc-client-003.local
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

backend:
  fullnameOverride: ""

  replicaCount: 1
  image:
    repository: agile-manifest-project/backend
    tag: latest
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 3000

  existingSecret: agile-manifest-secrets
  config:
    TZ: Europe/Moscow
    NODE_ENV: production
    MAX_API_BASE_URL: https://platform-api2.max.ru
    PUBLIC_BASE_URL: "https://5696077-bs94300.twc1.net/"
    FRONTEND_ORIGIN: ""
    TRUSTED_EMPLOYER_MIN_HIRES: "5"
  nodeSelector:
    kubernetes.io/hostname: test-schedule-semenov-02.hpc-client-003.local
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

# Внешний доступ настраивается в существующем Ingress отдельно от chart.
# Направьте его на frontend Service, порт frontend.service.port.
# Nginx во frontend сам проксирует API и вебхук в backend.

tests:
  enabled: true
  image: busybox:1.37.0

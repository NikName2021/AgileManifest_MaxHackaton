apiVersion: v1
kind: Secret
metadata:
  # Должно совпадать с backend.existingSecret в values.yaml.
  name: agile-manifest-secrets
type: Opaque
stringData:
  # Обязательные переменные. БД должна быть доступна из Pod backend.
  # Замените также пользователя, hostname и имя БД своими значениями.
  # Спецсимволы в пароле нужно URL-кодировать.
  DATABASE_URL: "postgresql://app_user:REPLACE_WITH_URL_ENCODED_PASSWORD@postgres.example.com:5432/app_db?schema=public"
  MAX_BOT_TOKEN: "REPLACE_WITH_MAX_BOT_TOKEN"

  # Необязательные переменные: раскомментируйте нужные и задайте свои значения.
  # Отдельный ключ подписи сессий. Генерация: openssl rand -hex 32
  # Без него backend выводит ключ из MAX_BOT_TOKEN.
  # SESSION_SECRET: "REPLACE_WITH_RANDOM_SESSION_SECRET"

  # Секрет для проверки входящих вебхуков MAX.
  # MAX_WEBHOOK_SECRET: "REPLACE_WITH_RANDOM_WEBHOOK_SECRET"

  # Включает доступ к API с фиксированным bearer-токеном для тестирования.
  # TEST_API_TOKEN: "REPLACE_WITH_RANDOM_TEST_API_TOKEN"

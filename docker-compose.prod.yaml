services:

  redis:
    image: redis:8.0-alpine
    restart: unless-stopped
    command: [ "redis-server", "--appendonly", "yes" ]
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - result_year

  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DATABASE}
      TZ: Europe/Moscow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - ${POSTGRES_PORT}:5432
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DATABASE}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - result_year

  backend:
    container_name: backend_result_year
    build:
      context: backend
      dockerfile: Dockerfile
    expose:
      - "8000"
    environment:
      PORT: 8000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DATABASE}
      REDIS_URL: redis://redis:6379
      SESSION_TTL: ${SESSION_TTL:-24h}
      RECAP_SHARE_TTL: ${RECAP_SHARE_TTL:-72h}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL to the public HTTPS origin}
      COOKIE_SECURE: "true"
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS to the public HTTPS origin}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - result_year
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://127.0.0.1:8000/health" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    volumes:
      - ./docker/config/nginx/${NGINX_FILE}:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80"
      - "443:443"
    environment:
      TZ: Europe/Moscow
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - result_year
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://127.0.0.1/" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s


volumes:
  postgres_data:
  redis_data:

networks:
  result_year:
    external: true
    driver: bridge

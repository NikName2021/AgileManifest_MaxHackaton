name: CI

on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master, dev ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  backend-checks:
    name: Backend build, migrations and health
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: hiring_ci
          POSTGRES_PASSWORD: hiring_ci_password
          POSTGRES_DB: hiring_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hiring_ci -d hiring_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://hiring_ci:hiring_ci_password@127.0.0.1:5432/hiring_ci?schema=public
      MAX_BOT_TOKEN: ci-placeholder
      MAX_API_BASE_URL: http://127.0.0.1:1
      PUBLIC_BASE_URL: ''
      SESSION_SECRET: ci-session-secret
      PORT: '3000'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: true
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate Prisma schema
        run: npx --no-install prisma validate

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Build backend
        run: npm run build

      - name: Apply committed migrations
        run: npx --no-install prisma migrate deploy

      - name: Check migration status
        run: npx --no-install prisma migrate status

      - name: Check migrations match Prisma schema
        run: >-
          npx --no-install prisma migrate diff
          --from-url "$DATABASE_URL"
          --to-schema-datamodel prisma/schema.prisma
          --exit-code

      - name: Check backend health with PostgreSQL
        shell: bash
        run: |
          npm start > "$RUNNER_TEMP/backend.log" 2>&1 &
          backend_pid=$!
          trap 'kill "$backend_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error \
            --retry 15 --retry-delay 2 --retry-connrefused \
            --connect-timeout 2 --max-time 5 \
            http://127.0.0.1:3000/health > "$RUNNER_TEMP/health.json"
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import assert from "node:assert/strict";
            const health = JSON.parse(readFileSync(process.env.RUNNER_TEMP + "/health.json", "utf8"));
            assert.equal(health.ok, true);
            assert.equal(health.db, "up");
          '

      - name: Show backend logs on failure
        if: failure()
        run: |
          if [[ -f "$RUNNER_TEMP/backend.log" ]]; then
            cat "$RUNNER_TEMP/backend.log"
          fi

  frontend-checks:
    name: Frontend lint, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: true
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run ESLint
        run: npm run lint

      - name: Run Vitest
        run: npm test

      - name: Type-check and build frontend
        run: npm run build

  openapi:
    name: OpenAPI validation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: true
          package-manager-cache: false

      - name: Validate API specification
        env:
          REDOCLY_SUPPRESS_UPDATE_NOTICE: 'true'
          REDOCLY_TELEMETRY: 'off'
        run: npx --yes @redocly/cli@2.41.1 lint --extends minimal openapi.yaml

  compose-smoke-test:
    name: Docker smoke (${{ matrix.compose-file }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [ backend-checks, frontend-checks, openapi ]
    strategy:
      fail-fast: false
      matrix:
        compose-file: [ docker-compose.yaml, docker-compose.prod.yaml ]
    env:
      COMPOSE_FILE: ${{ matrix.compose-file }}
      COMPOSE_PROJECT_NAME: maxhack-ci
      APP_NETWORK: maxhack-ci
      HTTP_PORT: '18080'
      POSTGRES_PORT: '15432'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Prepare isolated backend environment
        run: |
          echo "BACKEND_ENV_FILE=$RUNNER_TEMP/backend-ci.env" >> "$GITHUB_ENV"
          cat > "$RUNNER_TEMP/backend-ci.env" <<'ENV'
          MAX_BOT_TOKEN=ci-placeholder
          MAX_API_BASE_URL=http://127.0.0.1:1
          MAX_WEBHOOK_SECRET=ci-webhook-secret
          PUBLIC_BASE_URL=
          SESSION_SECRET=ci-session-secret
          TEST_API_TOKEN=
          ENV

      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config --quiet

      - name: Build and start containers
        run: docker compose --env-file .env.example up --build --detach --wait --wait-timeout 180

      - name: Check frontend, API and webhook through Nginx
        run: |
          curl --fail --silent --show-error http://127.0.0.1:18080/vacancies | grep -q '<!doctype html>'
          curl --fail --silent --show-error http://127.0.0.1:18080/health | python3 -c '
          import json, sys
          health = json.load(sys.stdin)
          assert health == {"ok": True, "db": "up"}, health
          '
          api_status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18080/api/vacancies)
          test "$api_status" = 401
          webhook_status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header 'Content-Type: application/json' --data '{}' http://127.0.0.1:18080/webhook/max)
          test "$webhook_status" = 401
          test "$(docker compose --env-file .env.example exec -T backend id -u)" != 0

      - name: Show container logs on failure
        if: failure()
        run: docker compose --env-file .env.example logs --no-color

      - name: Stop containers and remove test data
        if: always()
        run: docker compose --env-file .env.example down --volumes --remove-orphans

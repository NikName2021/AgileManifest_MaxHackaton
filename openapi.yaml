openapi: 3.0.3
info:
  title: MAX Hiring Assistant API
  description: >
    Собственный backend API ассистента сезонного найма (трек «Эффективный бизнес», MAX-хакатон).
    Используется мини-приложением работодателя. Бот (Bot Gateway) обращается к бизнес-логике
    напрямую, минуя HTTP API. Авторизация — bearer-токен: либо сессия, выданная через
    POST /api/auth/max (проверка initData мини-приложения MAX), либо фиксированный
    TEST_API_TOKEN для тестирования жюри без реального MAX-логина (см. раздел 12 ТЗ в docs/
    и backend/.env.example). GET /health и GET /api/benchmark — без авторизации (публичные данные).


    Решения по контракту, зафиксированные по итогам разбора вопросов, присланных
    фронтенд-разработчиком по предыдущей версии API (см. README.md, раздел
    «Решения по контракту»):
    1) роль отдельным полем не хранится — любой авторизованный пользователь может быть и
    работодателем, и кандидатом, доступ к записи определяется владением (employerUserId/
    candidateUserId), не ролью аккаунта;
    2) сессия — Bearer-токен в заголовке Authorization, НЕ HttpOnly cookie;
    3) все ошибки — единый конверт `{ error: { code, message, fields? } }` (см. схему Error ниже),
    вместо разных по форме ответов на разных ручках.


    Кабинет работника (v0.4.0): мини-приложение после входа предлагает режим «работодатель» или
    «работник». Режим — только выбор интерфейса и на сервере не хранится; права по-прежнему
    определяются userId из сессии и владением записью. Работодатель пользуется прежними
    /api/vacancies и GET /api/applications, работник — /api/jobs, /api/me/applications и /api/me.
    Новые ответы — camelCase, query-параметры — snake_case, даты — ISO 8601 UTC.
    Суммы зарплаты — целые рубли; период в модели не хранится, по смыслу продукта это рубли в месяц
    (как и бенчмарк «Работы России»). Если появится оплата за смену/час, нужно отдельное поле
    salary_period — до этого фильтр сравнивает суммы как есть.
  version: 0.7.0
servers:
  - url: http://localhost:3000
    description: Локальная разработка / Docker Compose
security:
  - bearerAuth: []
paths:
  /health:
    get:
      summary: Проверка живости сервиса
      operationId: healthCheck
      security: []
      responses:
        '200':
          description: Сервис работает
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  db:
                    type: string
                    example: up
        '503':
          description: БД недоступна
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: false
                  db:
                    type: string
                    example: down

  /api/auth/max:
    post:
      summary: Обменять initData мини-приложения MAX на сессионный токен
      operationId: authWithMax
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [init_data]
              properties:
                init_data:
                  type: string
                  description: Сырая строка initData, переданная MAX мини-приложению
      responses:
        '200':
          description: Сессия выдана
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: Bearer-токен для последующих запросов (Authorization Bearer <token>)
                  user_id:
                    type: integer
        '400':
          description: init_data не передан или дублирующиеся параметры в initData
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Подпись initData неверна или истёк срок годности
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/vacancies:
    get:
      summary: Список собственных вакансий авторизованного работодателя
      operationId: listVacancies
      responses:
        '200':
          description: Список вакансий
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Vacancy'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Создать вакансию (черновик) от имени авторизованного работодателя
      operationId: createVacancy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VacancyInput'
      responses:
        '201':
          description: Вакансия создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vacancy'
        '400':
          description: Ошибка валидации тела запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/vacancies/{id}:
    get:
      summary: Получить вакансию по id (только своя)
      operationId: getVacancy
      parameters:
        - $ref: '#/components/parameters/VacancyId'
      responses:
        '200':
          description: Вакансия
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vacancy'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Вакансия принадлежит другому работодателю
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Вакансия не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      summary: >
        Отредактировать черновик вакансии (раздел 3.1 хендоффа фронтенда). Разрешено только пока
        вакансия в статусе draft — у опубликованной/закрытой вакансии карточка уже могла уйти в
        MAX или воронка уже идёт, поэтому редактирование отклоняется явным 409, а не тихо
        расходится с тем, что уже видели кандидаты. Достаточно передать хотя бы одно поле.
      operationId: updateVacancy
      parameters:
        - $ref: '#/components/parameters/VacancyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VacancyPatchInput'
      responses:
        '200':
          description: Вакансия обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vacancy'
        '400':
          description: Ошибка валидации тела запроса (в т.ч. пустое тело или salary_min > salary_max)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Вакансия принадлежит другому работодателю
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Вакансия не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Вакансия не в статусе draft — редактирование запрещено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/vacancies/{id}/publish:
    post:
      summary: >
        Опубликовать вакансию (draft -> published): атомарный переход, сгенерировать и
        отправить карточку с кнопкой «Откликнуться» в MAX. При сбое отправки статус
        откатывается обратно в draft.
      operationId: publishVacancy
      parameters:
        - $ref: '#/components/parameters/VacancyId'
      responses:
        '200':
          description: Вакансия опубликована
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vacancy'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Вакансия принадлежит другому работодателю
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Вакансия не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >
            Вакансия уже опубликована (карточка подтверждена), или закрыта, либо
            code=employer_chat_missing — работодатель ещё не писал боту напрямую, публиковать
            карточку некуда (нужно сначала открыть личный чат с ботом), либо
            вакансия сейчас параллельно передостаётся другим запросом (атомарный lock на повторную доставку карточки, см. publishDeliveryAttemptAt) — повторите попытку через несколько секунд.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: >
            Не удалось отправить карточку в MAX. code=upstream_error — подтверждённый отказ,
            статус откатан обратно в draft, безопасно повторить публикацию. code=card_delivery_unknown
            — истёк таймаут ответа MAX, неизвестно, ушла ли карточка; вакансия ОСТАЁТСЯ published
            без cardMessageId (не откатывается специально, чтобы избежать дубля карточки) —
            повторный вызов publish безопасен и либо подтвердит доставку, либо повторит отправку.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/vacancies/{id}/close:
    post:
      summary: Закрыть вакансию
      operationId: closeVacancy
      parameters:
        - $ref: '#/components/parameters/VacancyId'
      responses:
        '200':
          description: Вакансия закрыта
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vacancy'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Вакансия принадлежит другому работодателю
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Вакансия не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/vacancies/{id}/applications:
    get:
      summary: Список откликов по вакансии (воронка). Содержит контакты кандидатов — доступен только владельцу вакансии.
      operationId: listVacancyApplications
      parameters:
        - $ref: '#/components/parameters/VacancyId'
      responses:
        '200':
          description: Список откликов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Application'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Вакансия принадлежит другому работодателю
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Вакансия не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/applications:
    get:
      summary: >
        Общий список откликов по всем вакансиям авторизованного работодателя (раздел 3.2
        хендоффа фронтенда) — с пагинацией и опциональным фильтром по статусу, в отличие от
        /api/vacancies/{id}/applications, который ограничен одной вакансией.
      operationId: listApplications
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [new, contacted, invited, hired, rejected]
        - name: limit
          in: query
          required: false
          description: По умолчанию 50, максимум 200
          schema:
            type: integer
            default: 50
            maximum: 200
        - name: offset
          in: query
          required: false
          description: По умолчанию 0
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Страница откликов
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Application'
                  total:
                    type: integer
                    description: Общее количество откликов, подходящих под фильтр (без учёта limit/offset)
                  limit:
                    type: integer
                  offset:
                    type: integer
        '400':
          description: Некорректные query-параметры
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: >
        Зафиксировать отклик авторизованного кандидата на опубликованную вакансию. Кандидат —
        только из сессии. Те же правила и та же транзакция, что у отклика через бота: проверка
        статуса и вставка идут под блокировкой строки вакансии, поэтому отклик не сохранится, если
        закрытие вакансии зафиксировалось раньше. Уведомление работодателю отправляется после
        сохранения; сбой MAX не отменяет отклик (notified=false).
      operationId: createApplication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationInput'
            example:
              vacancy_id: 42
              contact: '+7 900 000-00-00'
      responses:
        '201':
          description: Отклик создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedApplication'
        '400':
          description: >
            validation_error — в т.ч. fields.contact, если contact отсутствует, null, пустой
            после trim или длиннее 200 символов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: { code: validation_error, message: invalid request body, fields: { contact: [contact is required] } }
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: code=self_application_forbidden — отклик на собственную вакансию
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: code=not_found — вакансия не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >
            code=vacancy_unavailable — вакансия в статусе draft или closed;
            code=already_applied — этот пользователь уже откликался (через REST или бота),
            в т.ч. при параллельных запросах
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/applications/{id}:
    patch:
      summary: Сменить статус отклика (воронка) — только владелец вакансии
      operationId: updateApplicationStatus
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [new, contacted, invited, hired, rejected]
      responses:
        '200':
          description: >
            Статус обновлён (поле notified показывает, удалось ли уведомить кандидата в MAX;
            поле unchanged — true, если статус совпадал с уже сохранённым и запрос не привёл ни
            к записи в БД, ни к повторной отправке уведомления кандидату).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '400':
          description: Ошибка валидации тела запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Вакансия принадлежит другому работодателю
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Отклик не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/jobs:
    get:
      summary: >
        Каталог для работника — опубликованные вакансии ДРУГИХ пользователей. Черновики, закрытые
        и собственные вакансии исключаются на сервере. Вакансии, на которые пользователь уже
        откликнулся, остаются в выдаче с myApplication и canApply=false.
      operationId: listJobs
      parameters:
        - name: q
          in: query
          description: Поиск без учёта регистра по title и description (подстрока). trim; пустая строка не фильтрует.
          schema: { type: string, maxLength: 200 }
        - name: region_code
          in: query
          description: Код субъекта (совпадение с regionSubject) или исходный текст региона; значения — из GET /api/jobs/filters
          schema: { type: string, maxLength: 100 }
        - name: category
          in: query
          description: Точное совпадение с category
          schema: { type: string, maxLength: 100 }
        - name: schedule
          in: query
          schema: { type: string, enum: [seasonal, temporary, permanent] }
        - name: salary_from
          in: query
          description: >
            Нижняя граница, ₽ (целое >= 0). Фильтр — пересечение диапазонов: у вакансии с одной
            указанной границей она служит обеими. При активном зарплатном фильтре вакансии без обеих
            границ исключаются, без фильтра — показываются. 0 — действительная сумма.
            Пустое значение (?salary_from=) — фильтра нет.
          schema: { type: integer, minimum: 0, maximum: 2147483647 }
        - name: salary_to
          in: query
          description: Верхняя граница, ₽ (целое >= 0); при обеих границах salary_from <= salary_to, иначе 400
          schema: { type: integer, minimum: 0, maximum: 2147483647 }
        - name: student_friendly
          in: query
          description: true — только вакансии с отметкой «подходит студентам», false — только без неё
          schema: { type: string, enum: ['true', 'false'] }
        - name: sort
          in: query
          description: >
            newest — createdAt DESC, id DESC; salary_desc — COALESCE(salaryMax, salaryMin) DESC,
            вакансии без зарплаты в конце, затем createdAt DESC, id DESC
          schema: { type: string, enum: [newest, salary_desc], default: newest }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Страница каталога; total — с учётом всех фильтров до пагинации. Пустой результат — 200 с пустым items.
          content:
            application/json:
              schema:
                type: object
                required: [items, total, limit, offset]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Job'
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
              example:
                items:
                  - id: 42
                    title: Сборщик урожая
                    regionCode: '23'
                    category: agriculture
                    schedule: seasonal
                    salaryMin: 50000
                    salaryMax: 70000
                    description: Условия работы
                    subject: { code: '23', name: Краснодарский край }
                    headcount: 15
                    spotsLeft: 12
                    studentFriendly: false
                    status: published
                    createdAt: '2026-10-17T09:00:00.000Z'
                    employer: { displayName: Иван, trusted: true, confirmedHires: 7 }
                    myApplication: null
                    canApply: true
                    applyUnavailableReason: null
                total: 1
                limit: 20
                offset: 0
        '400':
          description: Некорректные query-параметры (validation_error с fields)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/jobs/filters:
    get:
      summary: >
        Значения для фильтров каталога — только из реально доступных (published, чужих) вакансий.
        Справочника названий регионов/категорий в проекте нет, поэтому label = value (исходное
        значение без расшифровки). Пустые значения не включаются.
      operationId: listJobFilters
      responses:
        '200':
          description: Значения фильтров
          content:
            application/json:
              schema:
                type: object
                required: [regions, categories]
                properties:
                  regions:
                    type: array
                    items: { $ref: '#/components/schemas/FilterOption' }
                  categories:
                    type: array
                    items: { $ref: '#/components/schemas/FilterOption' }
              example:
                regions: [{ value: '23', label: '23' }]
                categories: [{ value: agriculture, label: agriculture }]
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/jobs/{id}:
    get:
      summary: >
        Карточка вакансии для работника (полное description). Своя опубликованная вакансия
        доступна с canApply=false и applyUnavailableReason=own_vacancy (управление — по-прежнему
        /api/vacancies/{id}). Контакт работодателя (contactInfo) здесь не отдаётся — он виден
        кандидату в GET /api/me/applications после собственного отклика.
      operationId: getJob
      parameters:
        - $ref: '#/components/parameters/VacancyId'
      responses:
        '200':
          description: Вакансия
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          description: id — не положительное целое
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >
            code=not_found — вакансии нет, она черновик или закрыта (одинаковый ответ, чтобы подбором
            ID нельзя было отличить чужой черновик от отсутствующей записи)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/me/applications:
    get:
      summary: >
        История откликов текущего пользователя (candidateUserId из сессии), включая отклики на
        закрытые вакансии. Этап найма меняет только работодатель (REST или кнопки бота) — здесь
        он только отображается. Порядок — createdAt DESC, id DESC.
      operationId: listMyApplications
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [new, contacted, invited, hired, rejected] }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Страница истории
          content:
            application/json:
              schema:
                type: object
                required: [items, total, limit, offset]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/MyApplication'
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
        '400':
          description: Некорректные query-параметры
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/me:
    get:
      summary: Безопасный профиль текущего пользователя (без токенов и идентификаторов чатов)
      operationId: getMe
      responses:
        '200':
          description: Профиль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
              example:
                id: 7
                displayName: Иван
                applicationContact: '@ivan_max'
                hasBotChat: true
                employerTrust: { trusted: false, confirmedHires: 3, threshold: 5 }
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      summary: >
        Изменить сохранённый контакт для предзаполнения формы отклика. Принимает только
        application_contact; любые другие поля (id, maxUserId, chatId, role…) — 400. Контакты уже
        отправленных откликов не меняются; POST /api/applications всегда берёт contact из тела.
      operationId: updateMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [application_contact]
              additionalProperties: false
              properties:
                application_contact:
                  type: string
                  nullable: true
                  minLength: 1
                  maxLength: 200
                  description: trim, 1–200 символов; null очищает сохранённый контакт
            example:
              application_contact: '@ivan_max'
      responses:
        '200':
          description: Обновлённый профиль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          description: Ошибка валидации или лишние поля
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/team:
    get:
      summary: >
        «Моя бригада» — все, кого работодатель нанимал (статус hired) на своих вакансиях, по одному
        элементу на человека. Отмеченные «надёжными» — первыми, дальше по последнему найму.
      operationId: listTeam
      responses:
        '200':
          description: Бригада
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/TeamMember' }
                  total: { type: integer }
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/team/{id}:
    patch:
      summary: Отметить прошлого работника «надёжным» (id — id пользователя-кандидата)
      operationId: updateTeamMember
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reliable]
              additionalProperties: false
              properties:
                reliable: { type: boolean }
      responses:
        '200':
          description: Отметка сохранена
          content:
            application/json:
              schema:
                type: object
                properties:
                  candidateId: { type: integer }
                  reliable: { type: boolean }
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Этот человек не нанимался на вакансии работодателя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/vacancies/{id}/team-invites:
    post:
      summary: >
        Позвать бригаду на опубликованную вакансию. Каждому приходит сообщение в личный чат с ботом
        с кнопками «Приду» / «Не в этот раз». «Приду» сразу создаёт отклик со статусом invited и
        прошлым контактом человека, работодатель получает уведомление с кнопками воронки.
        Повторный вызов безопасен: уже приглашённым второе сообщение не уходит, недоставленным —
        отправляется снова. За один вызов — не больше 100 человек.
      operationId: inviteTeam
      parameters:
        - $ref: '#/components/parameters/VacancyId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                candidate_ids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { type: integer, minimum: 1 }
                  description: Кого позвать. Не передано — вся бригада.
            example:
              candidate_ids: [7, 9]
      responses:
        '200':
          description: Результат по каждому человеку
          content:
            application/json:
              schema:
                type: object
                required: [sent, results]
                properties:
                  sent: { type: integer }
                  results:
                    type: array
                    items:
                      type: object
                      required: [candidateId, outcome]
                      properties:
                        candidateId: { type: integer }
                        outcome:
                          type: string
                          enum: [sent, already_invited, already_applied, no_bot_chat, not_in_team, delivery_failed, limit_exceeded]
              example:
                sent: 1
                results:
                  - { candidateId: 7, outcome: sent }
                  - { candidateId: 9, outcome: no_bot_chat }
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Вакансия принадлежит другому работодателю
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Вакансия не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: code=vacancy_unavailable — вакансия не опубликована
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      summary: Приглашения бригады по вакансии и ответы на них (только владелец)
      operationId: listTeamInvites
      parameters:
        - $ref: '#/components/parameters/VacancyId'
      responses:
        '200':
          description: Приглашения
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/TeamInvite' }
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Вакансия принадлежит другому работодателю
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Вакансия не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/regions:
    get:
      summary: Справочник субъектов РФ (85) для выбора региона
      operationId: listRegions
      security: []
      responses:
        '200':
          description: Субъекты, по алфавиту
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Region' }

  /api/vacancies/{id}/poster.svg:
    get:
      summary: >
        Объявление A4 для печати (SVG): название, зарплата, график, место, сколько человек нужно и
        QR-код ссылки на отклик с меткой qr. Только для своей опубликованной вакансии. Запрос с
        Bearer-токеном — в <img src> напрямую не встраивается, нужно получить blob.
      operationId: getVacancyPoster
      parameters:
        - $ref: '#/components/parameters/VacancyId'
      responses:
        '200':
          description: SVG-документ
          content:
            image/svg+xml:
              schema: { type: string }
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Чужая запись
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: code=vacancy_unavailable — вакансия не опубликована
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: code=service_unavailable — username бота неизвестен (MAX_BOT_USERNAME)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/vacancies/{id}/qr.svg:
    get:
      summary: Только QR-код ссылки на отклик (метка qr), SVG
      operationId: getVacancyQr
      parameters:
        - $ref: '#/components/parameters/VacancyId'
      responses:
        '200':
          description: SVG-документ
          content:
            image/svg+xml:
              schema: { type: string }
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Чужая запись
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Конфликт состояния
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Сервис недоступен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/vacancies/{id}/stats:
    get:
      summary: Отклики по источникам и по этапам (только владелец)
      operationId: getVacancyStats
      parameters:
        - $ref: '#/components/parameters/VacancyId'
      responses:
        '200':
          description: Статистика
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  bySource:
                    type: object
                    additionalProperties: { type: integer }
                    description: Ключи — значения Application.source; unknown — отклики до v0.6.0
                  byStatus:
                    type: object
                    additionalProperties: { type: integer }
              example:
                total: 5
                bySource: { qr: 2, card: 2, miniapp: 1 }
                byStatus: { new: 3, invited: 1, hired: 1 }
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Чужая запись
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/applications/{id}/shift:
    patch:
      summary: >
        Назначить время выхода на смену приглашённому или нанятому кандидату. Кандидат сразу
        получает в личный чат время, место и кнопки «Приду» / «Не смогу»; если не ответит —
        напоминание примерно за 18 часов до выхода. Ответ уходит работодателю в чат. Новое время
        сбрасывает прошлый ответ; start_at = null снимает назначение.
      operationId: setApplicationShift
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [start_at]
              additionalProperties: false
              properties:
                start_at:
                  type: string
                  format: date-time
                  nullable: true
                  description: ISO 8601 со смещением, в будущем; в сообщениях показывается по МСК
                note:
                  type: string
                  nullable: true
                  maxLength: 200
                  description: Где и что взять с собой
            example:
              start_at: '2026-06-21T07:00:00+03:00'
              note: 'ул. Садовая 5, перчатки'
      responses:
        '200':
          description: Назначено
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  startAt: { type: string, format: date-time, nullable: true }
                  shiftNote: { type: string, nullable: true }
                  attendance: { type: string, nullable: true, enum: [pending, null] }
                  notified: { type: boolean, description: Удалось ли сообщить кандидату }
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Чужая запись
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: code=conflict — кандидат не в статусе invited или hired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/me/subscriptions:
    get:
      summary: Подписки текущего пользователя на новые вакансии
      operationId: listSubscriptions
      responses:
        '200':
          description: Подписки
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Subscription' }
                  hasBotChat:
                    type: boolean
                    description: false — рассылка невозможна, пока пользователь не запустит бота в личном чате
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: >
        Подписаться на новые вакансии. При публикации подходящей вакансии бот присылает её в личный
        чат с кнопками «Откликнуться» и «Отписаться» — одному человеку одну вакансию один раз.
        Не больше 5 подписок на пользователя.
      operationId: createSubscription
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                region_code: { type: string, nullable: true, description: 'Код субъекта или текст («Кубань»); нераспознанный — 400' }
                category: { type: string, nullable: true }
                schedule: { type: string, nullable: true, enum: [seasonal, temporary, permanent, null] }
                salary_from: { type: integer, nullable: true, minimum: 0 }
                student_only: { type: boolean }
            example:
              region_code: '23'
              schedule: seasonal
              salary_from: 3000
      responses:
        '201':
          description: Подписка создана
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: code=subscription_limit_reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/me/subscriptions/{id}:
    delete:
      summary: Удалить свою подписку
      operationId: deleteSubscription
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '204':
          description: Удалено
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/partner-channels:
    get:
      summary: >
        Чаты и каналы, куда пользователь добавил бота (вуз, штаб студотрядов, центр занятости).
        Канал появляется автоматически по событию MAX bot_added; публикация выключена, пока
        владелец её не включит.
      operationId: listPartnerChannels
      responses:
        '200':
          description: Каналы
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PartnerChannel' }
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/partner-channels/{id}:
    patch:
      summary: >
        Настроить канал: включить публикацию, регион, только студенческие вакансии. Подходящие
        вакансии публикуются туда при публикации, один раз, с кнопкой-ссылкой «Откликнуться».
      operationId: updatePartnerChannel
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                active: { type: boolean }
                region_code: { type: string, nullable: true }
                student_only: { type: boolean }
      responses:
        '200':
          description: Обновлено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartnerChannel' }
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Бота удалили из чата — сначала добавьте его снова
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/benchmark:
    get:
      summary: Рыночный бенчмарк по зарплате (кэш, потом trudvsem.ru «Работа России»)
      operationId: getBenchmark
      security: []
      parameters:
        - name: region_code
          in: query
          required: true
          schema:
            type: string
        - name: category
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Бенчмарк
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Benchmark'
        '400':
          description: Не переданы обязательные параметры
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Данных по бенчмарку нет
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        Токен из POST /api/auth/max, либо значение TEST_API_TOKEN (переменная окружения backend)
        для тестирования без реального MAX-логина. Заголовок: Authorization: Bearer <token>.

  parameters:
    VacancyId:
      name: id
      in: path
      required: true
      description: Положительное целое в пределах Postgres Int; иначе 400 validation_error
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647

  schemas:
    Error:
      type: object
      description: >
        Единый формат ошибки для всего API — во всех ответах 4xx/5xx, без исключений.
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - unauthorized
                - forbidden
                - not_found
                - validation_error
                - conflict
                - upstream_error
                - service_unavailable
                - internal_error
                - employer_chat_missing
                - card_delivery_unknown
                - self_application_forbidden
                - vacancy_unavailable
                - already_applied
                - subscription_limit_reached
            message:
              type: string
              description: Человекочитаемое сообщение (на английском, для логов/дебага, не для показа конечному пользователю как есть)
            fields:
              type: object
              nullable: true
              description: >
                Присутствует только при code=validation_error и только когда ошибку можно
                привязать к конкретным полям тела/query — { "имя_поля": ["сообщение", ...] }.
              additionalProperties:
                type: array
                items:
                  type: string

    CandidateSummary:
      type: object
      description: Урезанная информация о кандидате, встраиваемая в Application (только для владельца вакансии).
      properties:
        id:
          type: integer
        maxUserId:
          type: string
        displayName:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true

    Vacancy:
      type: object
      properties:
        id:
          type: integer
        employerUserId:
          type: integer
        title:
          type: string
        regionCode:
          type: string
        category:
          type: string
        schedule:
          type: string
          enum: [seasonal, temporary, permanent]
        salaryMin:
          type: integer
          nullable: true
        salaryMax:
          type: integer
          nullable: true
        description:
          type: string
          nullable: true
        contactInfo:
          type: string
          nullable: true
          description: Контакт работодателя для откликнувшихся (телефон/юзернейм MAX), показывается на карточке вакансии.
        status:
          type: string
          enum: [draft, published, closed]
        cardMessageId:
          type: string
          nullable: true
        employerChatId:
          type: string
          nullable: true
          description: >
            Чат MAX, застывший в момент публикации/создания — именно сюда уходят все будущие
            уведомления по этой вакансии, независимо от того, из какого чата работодатель
            пишет боту позже.
        regionSubject:
          type: string
          nullable: true
          description: Код субъекта РФ, распознанный по regionCode (GET /api/regions); null — не распознан
        subject:
          anyOf:
            - $ref: '#/components/schemas/Region'
            - { type: object, nullable: true, enum: [null] }
        headcount:
          type: integer
          nullable: true
          description: Сколько человек нужно; когда нанято столько же, вакансия закрывается сама
        studentFriendly:
          type: boolean
        publishedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        applyUrl:
          type: string
          nullable: true
          description: >
            Во всех ответах с вакансией работодателя. Deep link отклика
            https://max.ru/<botUsername>?start=apply_<id> — тот же, что в тексте карточки. null, если
            вакансия не опубликована или username бота неизвестен. Нужен, чтобы переслать ссылку
            вручную, в том числе для карточек, отправленных до появления текстовой ссылки.

    VacancyInput:
      type: object
      required: [title]
      description: >
        employer_id больше не передаётся — работодатель определяется по Bearer-токену.
        title+region_code+schedule+зарплата+description+contact_info собираются в текст карточки
        MAX (после markdown-экранирования) — итоговая длина не должна превышать 4000 символов
        (документированный лимит MAX на сообщение), иначе 400 validation_error с полем description.
        salary_min/salary_max — JSON-числа (строки вроде "" или "50000" отклоняются 400),
        ограничены диапазоном Postgres Int (максимум 2147483647).
      properties:
        title:
          type: string
        region_code:
          type: string
        category:
          type: string
        schedule:
          type: string
          enum: [seasonal, temporary, permanent]
        salary_min:
          type: integer
          nullable: true
        salary_max:
          type: integer
          nullable: true
        description:
          type: string
          nullable: true
        contact_info:
          type: string
          nullable: true
        headcount:
          type: integer
          nullable: true
          minimum: 1
          maximum: 1000
          description: Сколько человек нужно (строка «Нужно человек» в карточке)
        student_friendly:
          type: boolean
          description: Подходит студентам (строка в карточке, фильтр каталога, студенческие каналы)

    VacancyPatchInput:
      type: object
      description: >
        Все поля необязательны (частичное обновление), но хотя бы одно должно присутствовать —
        пустое тело отклоняется 400. Разрешено только для вакансии в статусе draft. salary_min<=
        salary_max и лимит длины итоговой карточки (4000 символов, см. VacancyInput) проверяются
        на СЛИЯНИИ переданных полей с уже сохранёнными значениями — например PATCH только с
        salary_min при уже сохранённом salary_max корректно проверится против него, а не пройдёт
        валидацию вслепую.
      minProperties: 1
      properties:
        title:
          type: string
        region_code:
          type: string
        category:
          type: string
        schedule:
          type: string
          enum: [seasonal, temporary, permanent]
        salary_min:
          type: integer
          nullable: true
        salary_max:
          type: integer
          nullable: true
        description:
          type: string
          nullable: true
        contact_info:
          type: string
          nullable: true
        headcount:
          type: integer
          nullable: true
          minimum: 1
          maximum: 1000
          description: Сколько человек нужно (строка «Нужно человек» в карточке)
        student_friendly:
          type: boolean
          description: Подходит студентам (строка в карточке, фильтр каталога, студенческие каналы)

    Application:
      type: object
      properties:
        id:
          type: integer
        vacancyId:
          type: integer
        candidateUserId:
          type: integer
        candidate:
          allOf:
            - $ref: '#/components/schemas/CandidateSummary'
          description: >
            Присутствует в GET /api/vacancies/{id}/applications, GET /api/applications и PATCH
            /api/applications/{id} — только поля CandidateSummary (без чатов и сохранённого контакта
            кандидата). Не возвращается в POST /api/applications.
        status:
          type: string
          enum: [new, contacted, invited, hired, rejected]
        contact:
          type: string
          nullable: true
        candidateChatId:
          type: string
          nullable: true
          description: Чат MAX, застывший в момент отклика — сюда уходят уведомления о смене статуса.
        vacancy:
          type: object
          description: В GET /api/applications и PATCH /api/applications/{id} — краткие сведения о вакансии.
          properties:
            id: { type: integer }
            title: { type: string }
            status: { type: string, enum: [draft, published, closed] }
        notified:
          type: boolean
          description: >
            Только в ответе POST /api/applications и PATCH /api/applications/{id} — удалось ли
            отправить уведомление в MAX. false не означает ошибку запроса: данные уже сохранены,
            просто сообщение в MAX не доставилось (см. лог backend, событие notify failed).
        unchanged:
          type: boolean
          description: >
            Только в ответе PATCH /api/applications/{id} — true, если переданный статус совпадал
            с уже сохранённым (запрос идемпотентен: ни новой записи в БД, ни повторного
            уведомления кандидату не было).
        hiredAt:
          type: string
          format: date-time
          nullable: true
          description: Последний перевод в статус hired (для «Моей бригады»).
        source:
          type: string
          nullable: true
          enum: [card, link, qr, subscription, channel, miniapp, team, null]
          description: >
            Откуда отклик: card — кнопка на карточке в чате, link — ссылка, qr — QR-объявление,
            subscription — рассылка по подписке, channel — канал партнёра, miniapp — мини-приложение,
            team — ответ на приглашение бригады. null — отклики до v0.6.0.
        startAt:
          type: string
          format: date-time
          nullable: true
          description: Назначенное время выхода на смену (PATCH /api/applications/{id}/shift)
        shiftNote:
          type: string
          nullable: true
        attendance:
          type: string
          nullable: true
          enum: [pending, confirmed, declined, null]
        vacancyClosed:
          type: boolean
          description: Только в ответе PATCH /api/applications/{id} — этот найм заполнил все места и вакансия закрыта
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ApplicationInput:
      type: object
      required: [vacancy_id, contact]
      description: >
        Кандидат определяется по Bearer-токену; candidate_user_id, status, имя и т.п. из тела
        игнорируются. contact обязателен с v0.4.0 (раньше был необязательным).
      properties:
        vacancy_id:
          type: integer
        contact:
          type: string
          minLength: 1
          maxLength: 200
          description: Телефон, username или ссылка MAX; trim, 1–200 символов

    CreatedApplication:
      type: object
      description: >
        Ответ POST /api/applications (v0.4.0 — явный DTO: служебный candidateChatId больше не
        возвращается).
      required: [id, vacancyId, candidateUserId, status, contact, createdAt, updatedAt, notified]
      properties:
        id: { type: integer }
        vacancyId: { type: integer }
        candidateUserId: { type: integer }
        status: { type: string, enum: [new] }
        contact: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        notified:
          type: boolean
          description: Удалось ли отправить уведомление работодателю в MAX. false — отклик всё равно сохранён.

    EmployerPublic:
      type: object
      required: [displayName, trusted, confirmedHires]
      description: Публичные сведения о работодателе. Отдельного поля «компания» нет — это имя пользователя в MAX.
      properties:
        displayName: { type: string, nullable: true }
        trusted:
          type: boolean
          description: >
            «Надёжный работодатель». Ставится автоматически, вручную её получить нельзя: нужно не
            меньше TRUSTED_EMPLOYER_MIN_HIRES (по умолчанию 5) разных людей, которые были наняты и
            сами подтвердили выход на смену кнопкой «Приду» (на любых вакансиях, в том числе на одной).
            Не засчитываются сам работодатель и пользователи без личного чата с ботом.
        confirmedHires:
          type: integer
          description: Сколько разных людей подтвердили выход на работу к этому работодателю

    MyApplicationRef:
      type: object
      required: [id, status, createdAt, updatedAt]
      properties:
        id: { type: integer }
        status: { type: string, enum: [new, contacted, invited, hired, rejected] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Job:
      type: object
      description: Вакансия в каталоге работника. Служебные поля доставки и контакты не включаются.
      required: [id, title, regionCode, subject, category, schedule, salaryMin, salaryMax, description, headcount, spotsLeft, studentFriendly, status, createdAt, employer, myApplication, canApply, applyUnavailableReason]
      properties:
        id: { type: integer }
        title: { type: string }
        regionCode: { type: string, description: 'Исходный текст региона, как ввёл работодатель' }
        subject:
          anyOf:
            - $ref: '#/components/schemas/Region'
            - { type: object, nullable: true, enum: [null] }
          description: Распознанный субъект РФ
        category: { type: string }
        schedule: { type: string, enum: [seasonal, temporary, permanent] }
        salaryMin: { type: integer, nullable: true, description: '₽; период не хранится (по смыслу — в месяц)' }
        salaryMax: { type: integer, nullable: true, description: '₽; период не хранится (по смыслу — в месяц)' }
        description: { type: string, nullable: true }
        headcount: { type: integer, nullable: true }
        spotsLeft: { type: integer, nullable: true, description: 'headcount минус нанятые; null — headcount не указан' }
        studentFriendly: { type: boolean }
        status: { type: string, enum: [published] }
        createdAt: { type: string, format: date-time }
        employer: { $ref: '#/components/schemas/EmployerPublic' }
        myApplication:
          anyOf:
            - $ref: '#/components/schemas/MyApplicationRef'
            - { type: object, nullable: true, enum: [null] }
          description: Собственный отклик текущего пользователя, если он есть
        canApply: { type: boolean }
        applyUnavailableReason:
          type: string
          nullable: true
          enum: [already_applied, own_vacancy, null]

    MyApplication:
      type: object
      required: [id, status, contact, createdAt, updatedAt, vacancy]
      properties:
        id: { type: integer }
        status:
          type: string
          enum: [new, contacted, invited, hired, rejected]
          description: Этап найма (меняет работодатель). Не путать с vacancy.status.
        contact:
          type: string
          nullable: true
          description: Контакт, подтверждённый кандидатом при отклике (null — только у старых откликов до v0.4.0)
        startAt: { type: string, format: date-time, nullable: true, description: Время выхода на смену }
        shiftNote: { type: string, nullable: true }
        attendance: { type: string, nullable: true, enum: [pending, confirmed, declined, null] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        vacancy:
          type: object
          required: [id, title, regionCode, subject, category, schedule, salaryMin, salaryMax, description, headcount, studentFriendly, contactInfo, status, employer]
          properties:
            id: { type: integer }
            title: { type: string }
            regionCode: { type: string }
            subject:
              anyOf:
                - $ref: '#/components/schemas/Region'
                - { type: object, nullable: true, enum: [null] }
            headcount: { type: integer, nullable: true }
            studentFriendly: { type: boolean }
            category: { type: string }
            schedule: { type: string, enum: [seasonal, temporary, permanent] }
            salaryMin: { type: integer, nullable: true }
            salaryMax: { type: integer, nullable: true }
            description: { type: string, nullable: true }
            contactInfo:
              type: string
              nullable: true
              description: Контакт работодателя — показывается только в собственной истории откликов
            status: { type: string, enum: [draft, published, closed] }
            employer: { $ref: '#/components/schemas/EmployerPublic' }
      example:
        id: 15
        status: invited
        contact: '+7 900 000-00-00'
        createdAt: '2026-10-17T09:10:00.000Z'
        updatedAt: '2026-10-17T10:00:00.000Z'
        vacancy:
          id: 42
          title: Сборщик урожая
          regionCode: '23'
          category: agriculture
          schedule: seasonal
          salaryMin: 50000
          salaryMax: 70000
          description: Условия работы
          contactInfo: '+7 999 000-00-00'
          status: closed
          employer: { displayName: Иван, trusted: true, confirmedHires: 7 }

    Profile:
      type: object
      required: [id, displayName, applicationContact, hasBotChat, employerTrust]
      properties:
        id: { type: integer }
        displayName: { type: string, nullable: true }
        applicationContact:
          type: string
          nullable: true
          description: Сохранённый контакт для предзаполнения формы отклика (не номер из MAX)
        hasBotChat:
          type: boolean
          description: >
            true — пользователь запускал бота в личном чате (событие bot_started), бот может
            присылать ему уведомления о статусе отклика. false — отклик сохраняется, но уведомить
            кандидата некуда: frontend должен предложить открыть чат с ботом. Это не гарантия
            доставки конкретного сообщения.
        employerTrust:
          type: object
          required: [trusted, confirmedHires, threshold]
          description: Своя отметка «Надёжный работодатель» — для прогресса в кабинете работодателя
          properties:
            trusted: { type: boolean }
            confirmedHires: { type: integer }
            threshold: { type: integer, description: Сколько подтверждённых наймов нужно }

    TeamMember:
      type: object
      required: [candidate, contact, hiredCount, lastHiredAt, lastVacancy, reliable, hasBotChat]
      properties:
        candidate:
          type: object
          required: [id, displayName]
          properties:
            id: { type: integer }
            displayName: { type: string, nullable: true }
        contact:
          type: string
          nullable: true
          description: Контакт из последнего отклика этого человека на вакансии работодателя
        hiredCount: { type: integer, description: Сколько раз был нанят на вакансии этого работодателя }
        lastHiredAt: { type: string, format: date-time, nullable: true }
        lastVacancy:
          type: object
          required: [id, title]
          properties:
            id: { type: integer }
            title: { type: string }
        reliable: { type: boolean, description: Отметка работодателя «надёжный» }
        hasBotChat:
          type: boolean
          description: false — бот не может написать человеку, приглашение вернёт outcome=no_bot_chat
      example:
        candidate: { id: 7, displayName: Саша }
        contact: '+7 900 000-00-00'
        hiredCount: 2
        lastHiredAt: '2025-07-01T09:00:00.000Z'
        lastVacancy: { id: 12, title: Сборщик черешни }
        reliable: true
        hasBotChat: true

    TeamInvite:
      type: object
      required: [id, status, createdAt, respondedAt, candidate]
      properties:
        id: { type: integer }
        status:
          type: string
          enum: [sent, accepted, declined, expired, undelivered]
          description: >
            sent — ждём ответа; accepted — согласился (создан отклик со статусом invited);
            declined — отказался; expired — вакансию закрыли до ответа; undelivered — MAX не принял
            сообщение, повторный POST team-invites отправит снова
        createdAt: { type: string, format: date-time }
        respondedAt: { type: string, format: date-time, nullable: true }
        candidate:
          type: object
          required: [id, displayName]
          properties:
            id: { type: integer }
            displayName: { type: string, nullable: true }

    Region:
      type: object
      required: [code, name]
      properties:
        code: { type: string, example: '23', description: Двузначный код субъекта РФ }
        name: { type: string, example: Краснодарский край }

    Subscription:
      type: object
      required: [id, region, category, schedule, salaryFrom, studentOnly, createdAt]
      properties:
        id: { type: integer }
        region:
          anyOf:
            - $ref: '#/components/schemas/Region'
            - { type: object, nullable: true, enum: [null] }
          description: null — вся Россия
        category: { type: string, nullable: true }
        schedule: { type: string, nullable: true, enum: [seasonal, temporary, permanent, null] }
        salaryFrom: { type: integer, nullable: true }
        studentOnly: { type: boolean }
        createdAt: { type: string, format: date-time }

    PartnerChannel:
      type: object
      required: [id, title, isChannel, active, region, studentOnly, removed, createdAt]
      properties:
        id: { type: integer }
        title: { type: string, nullable: true }
        isChannel: { type: boolean, description: 'true — канал, false — групповой чат' }
        active: { type: boolean, description: Публикуются ли сюда вакансии }
        region:
          anyOf:
            - $ref: '#/components/schemas/Region'
            - { type: object, nullable: true, enum: [null] }
          description: null — вакансии из всех регионов
        studentOnly: { type: boolean, description: Только вакансии с отметкой «подходит студентам» }
        removed: { type: boolean, description: 'Бота удалили из чата — публикация невозможна, пока его не добавят снова' }
        createdAt: { type: string, format: date-time }

    FilterOption:
      type: object
      required: [value, label]
      properties:
        value: { type: string }
        label: { type: string }

    Benchmark:
      type: object
      properties:
        avgSalaryMin:
          type: integer
          nullable: true
        avgSalaryMax:
          type: integer
          nullable: true
        vacancyCount:
          type: integer
          description: Сколько найденных вакансий указали зарплату
        isFresh:
          type: boolean
        scope:
          type: string
          enum: [region, country]
          description: region — по распознанному региону; country — по России (регион не распознан или в нём меньше 5 вакансий с зарплатой)
        regionName:
          type: string
          nullable: true

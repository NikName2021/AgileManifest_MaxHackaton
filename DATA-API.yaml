# DATA-API.yaml
#
# ВАЖНО (проверить перед сдачей): организаторы хакатона просят файл "DATA-API.yaml по заданной
# структуре", но точный образец/шаблон в разобранном тексте кейса не был приведён дословно —
# только перечень обязательных полей (версия схемы, идентификатор команды, базовый адрес,
# обязательные проверки, HTTP-методы, параметры, роли, статус-коды, формат ответа), см.
# docs/ТЗ — Ассистент сезонного найма (MAX).md, раздел 11. Ниже — состав на основе этого
# перечня. Если организаторы прикладывали отдельный файл-шаблон/пример DATA-API.yaml к кейсу —
# сверьте ключи и вложенность с ним и поправьте при необходимости.

schema_version: "1.1"

team:
  # TODO: вписать реальный идентификатор/название команды перед сдачей
  id: "REPLACE_WITH_TEAM_ID"
  name: "REPLACE_WITH_TEAM_NAME"

api:
  # TODO: вписать реальный HTTPS-адрес backend на время проверки жюри
  base_url: "https://REPLACE_WITH_PUBLIC_HTTPS_URL"
  spec: "./openapi.yaml"

  health_check:
    method: GET
    path: /health
    expected_status: 200

  auth:
    type: bearer
    note: >
      Authorization: Bearer <token>. Токен — либо сессия мини-приложения, выданная через
      POST /api/auth/max (проверка подписи initData MAX HMAC-SHA256, см. раздел 12 ТЗ), либо
      фиксированный TEST_API_TOKEN из backend/.env — для проверки жюри без реального MAX-логина.
      GET /health и GET /api/benchmark авторизации не требуют. Работодатель/кандидат определяются
      по токену, а не по полям тела запроса (см. endpoints ниже). Сессия — Bearer-токен в
      заголовке, НЕ HttpOnly cookie (осознанное решение по итогам вопросов фронтенда).

  roles:
    - name: employer
      description: >
        Работодатель — создаёт, редактирует (черновик), публикует и закрывает вакансии, видит
        отклики (по одной вакансии или общим списком) и меняет их статус. Роль не хранится
        отдельным полем в БД — любой авторизованный пользователь может выступать и работодателем,
        и кандидатом; конкретное действие разрешено по владению записью (employerUserId), а не по
        роли аккаунта.
      entry_point: "личный чат с ботом (/новая_вакансия) или мини-приложение, авторизованное через /api/auth/max"
    - name: candidate
      description: >
        Кандидат — откликается на вакансию по кнопке/deep link в карточке, либо через мини-приложение.
        Так же не привязан к отдельной роли аккаунта — определяется владением (candidateUserId).
      entry_point: "кнопка «Откликнуться» на карточке вакансии в MAX, либо POST /api/applications из мини-приложения"

  endpoints:
    - method: POST
      path: /api/auth/max
      role: public
      auth: none
      params:
        - name: init_data
          in: body
          required: true
          type: string
      responses:
        "200": "{ token, user_id }"
        "400": "validation error (including duplicate initData parameter keys)"
        "401": "invalid or expired initData signature"

    - method: GET
      path: /api/vacancies
      role: employer
      auth: bearer
      params: []
      responses:
        "200": "array of Vacancy (only caller's own)"
        "401": "unauthorized"

    - method: POST
      path: /api/vacancies
      role: employer
      auth: bearer
      params:
        - name: title
          in: body
          required: true
          type: string
        - name: contact_info
          in: body
          required: false
          type: string
      responses:
        "201": "Vacancy"
        "400": "validation error"
        "401": "unauthorized"

    - method: GET
      path: /api/vacancies/{id}
      role: employer
      auth: bearer
      params:
        - name: id
          in: path
          required: true
          type: integer
      responses:
        "200": "Vacancy"
        "401": "unauthorized"
        "403": "not owner"
        "404": "not found"

    - method: PATCH
      path: /api/vacancies/{id}
      role: employer
      auth: bearer
      note: "Редактирование разрешено только для вакансии в статусе draft; хотя бы одно поле обязательно."
      params:
        - name: id
          in: path
          required: true
          type: integer
        - name: title
          in: body
          required: false
          type: string
        - name: region_code
          in: body
          required: false
          type: string
        - name: category
          in: body
          required: false
          type: string
        - name: schedule
          in: body
          required: false
          type: string
          enum: [seasonal, temporary, permanent]
        - name: salary_min
          in: body
          required: false
          type: integer
        - name: salary_max
          in: body
          required: false
          type: integer
        - name: description
          in: body
          required: false
          type: string
        - name: contact_info
          in: body
          required: false
          type: string
      responses:
        "200": "Vacancy"
        "400": "validation error (empty body, or salary_min > salary_max)"
        "401": "unauthorized"
        "403": "not owner"
        "404": "not found"
        "409": "vacancy is not in draft status"

    - method: POST
      path: /api/vacancies/{id}/publish
      role: employer
      auth: bearer
      params:
        - name: id
          in: path
          required: true
          type: integer
      responses:
        "200": "Vacancy"
        "401": "unauthorized"
        "403": "not owner"
        "404": "not found"
        "409": "already published or closed"
        "502": "failed to deliver card to MAX, rolled back to draft"

    - method: POST
      path: /api/vacancies/{id}/close
      role: employer
      auth: bearer
      params:
        - name: id
          in: path
          required: true
          type: integer
      responses:
        "200": "Vacancy"
        "401": "unauthorized"
        "403": "not owner"
        "404": "not found"

    - method: GET
      path: /api/vacancies/{id}/applications
      role: employer
      auth: bearer
      note: "Отклики по одной конкретной вакансии, без пагинации. Для общего списка по всем вакансиям см. GET /api/applications."
      params:
        - name: id
          in: path
          required: true
          type: integer
      responses:
        "200": "array of Application (each includes nested candidate)"
        "401": "unauthorized"
        "403": "not owner"
        "404": "not found"

    - method: GET
      path: /api/applications
      role: employer
      auth: bearer
      note: "Общий список откликов по всем вакансиям работодателя, с пагинацией и фильтром по статусу."
      params:
        - name: status
          in: query
          required: false
          type: string
          enum: [new, contacted, invited, hired, rejected]
        - name: limit
          in: query
          required: false
          type: integer
          default: 50
          max: 200
        - name: offset
          in: query
          required: false
          type: integer
          default: 0
      responses:
        "200": "{ items: Application[], total, limit, offset }"
        "400": "invalid query parameters"
        "401": "unauthorized"

    - method: POST
      path: /api/applications
      role: candidate
      auth: bearer
      params:
        - name: vacancy_id
          in: body
          required: true
          type: integer
        - name: contact
          in: body
          required: false
          type: string
      responses:
        "201": "Application (with notified: boolean)"
        "400": "validation error"
        "401": "unauthorized"
        "404": "vacancy not found"
        "409": "vacancy not published, or duplicate application"

    - method: PATCH
      path: /api/applications/{id}
      role: employer
      auth: bearer
      params:
        - name: id
          in: path
          required: true
          type: integer
        - name: status
          in: body
          required: true
          type: string
          enum: [new, contacted, invited, hired, rejected]
      responses:
        "200": "Application (with notified: boolean, unchanged: boolean)"
        "400": "validation error"
        "401": "unauthorized"
        "403": "not owner"
        "404": "not found"

    - method: GET
      path: /api/benchmark
      role: public
      auth: none
      params:
        - name: region_code
          in: query
          required: true
          type: string
        - name: category
          in: query
          required: true
          type: string
      responses:
        "200": "Benchmark"
        "400": "validation error"
        "404": "no data"

  response_format:
    content_type: application/json
    error_shape:
      error:
        code: "string, one of: unauthorized | forbidden | not_found | validation_error | conflict | upstream_error | service_unavailable | internal_error | employer_chat_missing | card_delivery_unknown"
        message: "human-readable string (English, for debugging/logs)"
        fields: "optional object, present only when code=validation_error and errors map to specific fields — { fieldName: [message, ...] }"
    note: >
      Единый конверт ошибки для ВСЕХ эндпоинтов без исключений (раньше формат отличался между
      ручками) — см. backend/src/errors.ts и components.schemas.Error в openapi.yaml.
      employer_chat_missing (409, POST /api/vacancies/{id}/publish) — работодатель ещё не писал
      боту напрямую, publish некуда слать карточку. card_delivery_unknown (502, тот же эндпоинт) —
      таймаут ответа MAX, неизвестно, ушла ли карточка; вакансия остаётся published без
      cardMessageId, повторный publish безопасен (не создаёт дубликат).

  cors:
    note: >
      FRONTEND_ORIGIN (env, через запятую) — origin(ы) frontend, разрешённые для CORS-запросов с
      заголовком Authorization. Методы GET/POST/PATCH/OPTIONS, заголовки Authorization и
      Content-Type. Не задан — разрешён любой origin (dev/жюри).

test_data:
  path: "./test-data/"

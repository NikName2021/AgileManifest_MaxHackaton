services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hiring}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hiring_dev_password}
      POSTGRES_DB: ${POSTGRES_DATABASE:-hiring}
      TZ: Europe/Moscow
    volumes:
      - postgres_data_m:/var/lib/postgresql/data
    ports:
      - ${POSTGRES_PORT:-5446}:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - max_hackathon

  backend:
    build:
      context: backend
    init: true
    restart: unless-stopped
    expose:
      - "3000"
    env_file:
      - path: ./docker/config/backend.local.env
      - path: ${BACKEND_ENV_FILE:-./backend/.env}
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-hiring}:${POSTGRES_PASSWORD:-hiring_dev_password}@postgres:5432/${POSTGRES_DATABASE:-hiring}?schema=public
      PORT: "3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - max_hackathon

  frontend:
    build:
      context: frontend
    restart: unless-stopped
    volumes:
      - ./docker/config/nginx/${NGINX_FILE:-local_nginx.conf}:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${HTTP_PORT:-80}:80"
    environment:
      TZ: Europe/Moscow
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - max_hackathon

volumes:
  postgres_data_m:

networks:
  max_hackathon:
    name: ${APP_NETWORK:-max_hackathon}
    driver: bridge

# Формат материалов для проверки по разделу «Формат сдачи» кейса.
# Это структура проекта; совместимость с отдельной схемой организаторов нужно
# подтвердить, если такая схема предоставлена. Секреты передаются отдельно.
schema_version: "1.1"
solution:
  name: "Ассистент сезонного найма в MAX"
submission_status: deployment_pending

api:
  # Заполнить реальным HTTPS-адресом после развёртывания, до передачи жюри.
  base_url: null
  local_base_url: "http://localhost"
  spec: "./openapi.yaml"

  health_check:
    method: GET
    path: /health
    expected_status: 200

  auth:
    type: bearer
    note: >
      Authorization: Bearer <token>. Токен — либо сессия мини-приложения, выданная через
      POST /api/auth/max (проверка подписи initData MAX HMAC-SHA256, см. раздел 12 ТЗ), либо
      фиксированный TEST_API_TOKEN из backend/.env — для проверки жюри без реального MAX-логина.
      GET /health и GET /api/benchmark авторизации не требуют. Работодатель/кандидат определяются
      по токену, а не по полям тела запроса (см. endpoints ниже). Сессия — Bearer-токен в
      заголовке, НЕ HttpOnly cookie (осознанное решение по итогам вопросов фронтенда).

  roles:
    - name: employer
      description: >
        Работодатель — создаёт, редактирует (черновик), публикует и закрывает вакансии, видит
        отклики (по одной вакансии или общим списком) и меняет их статус. Роль не хранится
        отдельным полем в БД — любой авторизованный пользователь может выступать и работодателем,
        и кандидатом; конкретное действие разрешено по владению записью (employerUserId), а не по
        роли аккаунта.
      entry_point: "личный чат с ботом (/новая_вакансия) или мини-приложение, авторизованное через /api/auth/max"
    - name: candidate
      description: >
        Кандидат — откликается на вакансию по кнопке/deep link в карточке, либо через мини-приложение.
        Так же не привязан к отдельной роли аккаунта — определяется владением (candidateUserId).
      entry_point: "кнопка «Откликнуться» на карточке вакансии в MAX, либо POST /api/applications из мини-приложения"

  checks:
    runner: "python3 test-data/check-api.py --base-url <BASE_URL> --access-file <ACCESS_FILE>"
    preparation: "backend/prisma/seed-demo.mjs (ALLOW_DEMO_SEED=true), see test-data/README.md"
    data_mode: synthetic
    live_scenario: "test-data/README.md — section 3; required separately after deployment"
    required_scenarios:
      - "health: 200, {ok: true, db: up}"
      - "no bearer token: 401, error.code=unauthorized"
      - "invalid request body: 400, error.code=validation_error"
      - "employer creates draft: 201, id/employerUserId/status=draft"
      - "owner reads and edits draft: 200, updated fields"
      - "candidate reads employer vacancy: 403, error.code=forbidden"
      - "publish without employer chat: 409, error.code=employer_chat_missing; remains draft"
      - "apply to draft: 409, error.code=conflict"
      - "edit published vacancy: 409, error.code=conflict"
      - "candidate applies to synthetic published vacancy: 201, id/status=new/notified=false"
      - "duplicate application: 409, error.code=conflict"
      - "owner lists applications: 200, candidate included; paginated list has items/total/limit/offset"
      - "candidate reads or changes employer funnel: 403, error.code=forbidden"
      - "owner invites candidate: 200, status=invited/notified=false/unchanged=false"
      - "repeat invitation: 200, unchanged=true/notified=false"
      - "owner closes vacancy: 200, status=closed; apply/publish after close: 409"

  request_format:
    content_type: application/json
    headers:
      Authorization: "Bearer <employer.token or candidate.token from the private access file>"
    note: "Public endpoints do not require Authorization. Full request schemas and response fields are in the linked OpenAPI operation."

  endpoints:
    - method: POST
      path: /api/auth/max
      contract: "./openapi.yaml#/paths/~1api~1auth~1max/post"
      role: public
      auth: none
      params:
        - name: init_data
          in: body
          required: true
          type: string
      responses:
        "200": "{ token, user_id }"
        "400": "validation error (including duplicate initData parameter keys)"
        "401": "invalid or expired initData signature"

    - method: GET
      path: /api/vacancies
      contract: "./openapi.yaml#/paths/~1api~1vacancies/get"
      role: employer
      auth: bearer
      params: []
      responses:
        "200": "array of Vacancy (only caller's own)"
        "401": "unauthorized"

    - method: POST
      path: /api/vacancies
      contract: "./openapi.yaml#/paths/~1api~1vacancies/post"
      role: employer
      auth: bearer
      params:
        - name: title
          in: body
          required: true
          type: string
        - name: region_code
          in: body
          required: false
          type: string
        - name: category
          in: body
          required: false
          type: string
        - name: schedule
          in: body
          required: false
          type: string
          enum: [seasonal, temporary, permanent]
        - name: salary_min
          in: body
          required: false
          type: integer
          nullable: true
        - name: salary_max
          in: body
          required: false
          type: integer
          nullable: true
        - name: description
          in: body
          required: false
          type: string
          nullable: true
        - name: contact_info
          in: body
          required: false
          type: string
      responses:
        "201": "Vacancy"
        "400": "validation error"
        "401": "unauthorized"

    - method: GET
      path: /api/vacancies/{id}
      contract: "./openapi.yaml#/paths/~1api~1vacancies~1{id}/get"
      role: employer
      auth: bearer
      params:
        - name: id
          in: path
          required: true
          type: integer
      responses:
        "200": "Vacancy"
        "401": "unauthorized"
        "403": "not owner"
        "404": "not found"

    - method: PATCH
      path: /api/vacancies/{id}
      contract: "./openapi.yaml#/paths/~1api~1vacancies~1{id}/patch"
      role: employer
      auth: bearer
      note: "Редактирование разрешено только для вакансии в статусе draft; хотя бы одно поле обязательно."
      params:
        - name: id
          in: path
          required: true
          type: integer
        - name: title
          in: body
          required: false
          type: string
        - name: region_code
          in: body
          required: false
          type: string
        - name: category
          in: body
          required: false
          type: string
        - name: schedule
          in: body
          required: false
          type: string
          enum: [seasonal, temporary, permanent]
        - name: salary_min
          in: body
          required: false
          type: integer
        - name: salary_max
          in: body
          required: false
          type: integer
        - name: description
          in: body
          required: false
          type: string
        - name: contact_info
          in: body
          required: false
          type: string
      responses:
        "200": "Vacancy"
        "400": "validation error (empty body, or salary_min > salary_max)"
        "401": "unauthorized"
        "403": "not owner"
        "404": "not found"
        "409": "vacancy is not in draft status"

    - method: POST
      path: /api/vacancies/{id}/publish
      contract: "./openapi.yaml#/paths/~1api~1vacancies~1{id}~1publish/post"
      role: employer
      auth: bearer
      params:
        - name: id
          in: path
          required: true
          type: integer
      responses:
        "200": "Vacancy"
        "401": "unauthorized"
        "403": "not owner"
        "404": "not found"
        "409": "employer_chat_missing, or conflict (closed/already published with a confirmed card)"
        "502": "upstream_error: rolled back to draft; card_delivery_unknown: delivery timed out, remains published"

    - method: POST
      path: /api/vacancies/{id}/close
      contract: "./openapi.yaml#/paths/~1api~1vacancies~1{id}~1close/post"
      role: employer
      auth: bearer
      params:
        - name: id
          in: path
          required: true
          type: integer
      responses:
        "200": "Vacancy"
        "401": "unauthorized"
        "403": "not owner"
        "404": "not found"

    - method: GET
      path: /api/vacancies/{id}/applications
      contract: "./openapi.yaml#/paths/~1api~1vacancies~1{id}~1applications/get"
      role: employer
      auth: bearer
      note: "Отклики по одной конкретной вакансии, без пагинации. Для общего списка по всем вакансиям см. GET /api/applications."
      params:
        - name: id
          in: path
          required: true
          type: integer
      responses:
        "200": "array of Application (each includes nested candidate)"
        "401": "unauthorized"
        "403": "not owner"
        "404": "not found"

    - method: GET
      path: /api/applications
      contract: "./openapi.yaml#/paths/~1api~1applications/get"
      role: employer
      auth: bearer
      note: "Общий список откликов по всем вакансиям работодателя, с пагинацией и фильтром по статусу."
      params:
        - name: status
          in: query
          required: false
          type: string
          enum: [new, contacted, invited, hired, rejected]
        - name: limit
          in: query
          required: false
          type: integer
          default: 50
          max: 200
        - name: offset
          in: query
          required: false
          type: integer
          default: 0
      responses:
        "200": "{ items: Application[], total, limit, offset }"
        "400": "invalid query parameters"
        "401": "unauthorized"

    - method: POST
      path: /api/applications
      contract: "./openapi.yaml#/paths/~1api~1applications/post"
      role: candidate
      auth: bearer
      params:
        - name: vacancy_id
          in: body
          required: true
          type: integer
        - name: contact
          in: body
          required: false
          type: string
      responses:
        "201": "Application (with notified: boolean)"
        "400": "validation error"
        "401": "unauthorized"
        "404": "vacancy not found"
        "409": "vacancy not published, or duplicate application"

    - method: PATCH
      path: /api/applications/{id}
      contract: "./openapi.yaml#/paths/~1api~1applications~1{id}/patch"
      role: employer
      auth: bearer
      params:
        - name: id
          in: path
          required: true
          type: integer
        - name: status
          in: body
          required: true
          type: string
          enum: [new, contacted, invited, hired, rejected]
      responses:
        "200": "Application (with notified: boolean, unchanged: boolean)"
        "400": "validation error"
        "401": "unauthorized"
        "403": "not owner"
        "404": "not found"

    - method: GET
      path: /api/benchmark
      contract: "./openapi.yaml#/paths/~1api~1benchmark/get"
      role: public
      auth: none
      params:
        - name: region_code
          in: query
          required: true
          type: string
        - name: category
          in: query
          required: true
          type: string
      responses:
        "200": "Benchmark"
        "400": "validation error"
        "404": "no data"

  response_format:
    content_type: application/json
    error_shape:
      error:
        code: "string, one of: unauthorized | forbidden | not_found | validation_error | conflict | upstream_error | service_unavailable | internal_error | employer_chat_missing | card_delivery_unknown"
        message: "human-readable string (English, for debugging/logs)"
        fields: "optional object, present only when code=validation_error and errors map to specific fields — { fieldName: [message, ...] }"
    note: >
      Единый конверт ошибки для ВСЕХ эндпоинтов без исключений (раньше формат отличался между
      ручками) — см. backend/src/errors.ts и components.schemas.Error в openapi.yaml.
      employer_chat_missing (409, POST /api/vacancies/{id}/publish) — работодатель ещё не писал
      боту напрямую, publish некуда слать карточку. card_delivery_unknown (502, тот же эндпоинт) —
      таймаут ответа MAX, неизвестно, ушла ли карточка; вакансия остаётся published без
      cardMessageId. Повторный publish повторяет отправку; при неоднозначном таймауте
      фактическую доставку карточки следует проверить в MAX.

  cors:
    note: >
      FRONTEND_ORIGIN (env, через запятую) — origin(ы) frontend, разрешённые для CORS-запросов с
      заголовком Authorization. Методы GET/POST/PATCH/OPTIONS, заголовки Authorization и
      Content-Type. Не задан — разрешён любой origin (dev/жюри).

test_data:
  path: "./test-data/"
  synthetic: true
  setup: "Explicit CLI seed creates two independent users and a published fixture without MAX delivery."
  credentials: "Private .jury-access.json; separate employer/candidate tokens, never committed."
  repeat: "Generate a new fixture before each run; the checker creates an application and closes the fixture vacancy."
  limitations: "MAX login, actual publication, notifications and live benchmark are verified separately on the deployed service."

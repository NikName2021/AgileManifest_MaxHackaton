{{- $ctx := dict "root" . "component" "frontend" }}
{{- $backendName := include "helm.componentName" (dict "root" . "component" "backend") }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "helm.componentName" $ctx }}-nginx
  labels:
    {{- include "helm.labels" $ctx | nindent 4 }}
data:
  default.conf: |
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 108M;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location /api/ {
            proxy_pass http://{{ $backendName }}:{{ .Values.backend.service.port }};
        }
        location = /webhook/max {
            proxy_pass http://{{ $backendName }}:{{ .Values.backend.service.port }};
        }
        location = /health {
            proxy_pass http://{{ $backendName }}:{{ .Values.backend.service.port }};
        }
        location / {
            try_files $uri $uri/ /index.html;
        }
    }

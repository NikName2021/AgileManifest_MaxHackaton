apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      nodeSelector:
        kubernetes.io/hostname: test-schedule-semenov-02.hpc-client-003.local

      imagePullSecrets:
        - name: my-private-registry

      containers:
        - name: backend
          image: 0f0c1e4e-honest-aquila.registry.twcstorage.ru/scheduler-project/smart-scheduler-backend:latest

          ports:
            - containerPort: 8000

          envFrom:
            - secretRef:
                name: scheduler-secrets
            - configMapRef:
                name: scheduler-config

          env:
            - name: RUN_MIGRATIONS
              value: "true"

          volumeMounts:
            - name: uploads
              mountPath: /app/app/uploads

          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
              httpHeaders:
                - name: Host
                  value: scheduler.example.com
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10

          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
              httpHeaders:
                - name: Host
                  value: scheduler.example.com
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5

          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi

      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: uploads

---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: app
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
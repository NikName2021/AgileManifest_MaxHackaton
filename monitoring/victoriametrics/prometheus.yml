global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: victoriametrics
    static_configs:
      - targets:
          - victoriametrics:8428

  - job_name: vmagent
    static_configs:
      - targets:
          - vmagent:8429

  - job_name: loki
    static_configs:
      - targets:
          - loki:3100

  - job_name: nginx
    static_configs:
      - targets:
          - nginx-exporter:9113

  - job_name: postgres
    static_configs:
      - targets:
          - postgres-exporter:9187

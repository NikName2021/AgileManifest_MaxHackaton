openapi: 3.0.3
info:
  title: MAX Hiring Assistant API
  description: >
    Собственный backend API ассистента сезонного найма (трек «Эффективный бизнес», MAX-хакатон).
    Используется мини-приложением работодателя. Бот (Bot Gateway) обращается к бизнес-логике
    напрямую, минуя HTTP API. Авторизация — bearer-токен: либо сессия, выданная через
    POST /api/auth/max (проверка initData мини-приложения MAX), либо фиксированный
    TEST_API_TOKEN для тестирования жюри без реального MAX-логина (см. раздел 12 ТЗ в docs/
    и backend/.env.example). GET /health и GET /api/benchmark — без авторизации (публичные данные).
  version: 0.2.0
servers:
  - url: http://localhost:3000
    description: Локальная разработка / Docker Compose
security:
  - bearerAuth: []
paths:
  /health:
    get:
      summary: Проверка живости сервиса
      operationId: healthCheck
      security: []
      responses:
        '200':
          description: Сервис работает
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
        '503':
          description: БД недоступна

  /api/auth/max:
    post:
      summary: Обменять initData мини-приложения MAX на сессионный токен
      operationId: authWithMax
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [init_data]
              properties:
                init_data:
                  type: string
                  description: Сырая строка initData, переданная MAX мини-приложению
      responses:
        '200':
          description: Сессия выдана
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: Bearer-токен для последующих запросов (Authorization Bearer <token>)
                  user_id:
                    type: integer
        '400':
          description: init_data не передан
        '401':
          description: Подпись initData неверна или истёк срок годности

  /api/vacancies:
    get:
      summary: Список собственных вакансий авторизованного работодателя
      operationId: listVacancies
      responses:
        '200':
          description: Список вакансий
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Vacancy'
        '401':
          description: Не авторизован
    post:
      summary: Создать вакансию (черновик) от имени авторизованного работодателя
      operationId: createVacancy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VacancyInput'
      responses:
        '201':
          description: Вакансия создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vacancy'
        '400':
          description: Ошибка валидации тела запроса
        '401':
          description: Не авторизован

  /api/vacancies/{id}:
    get:
      summary: Получить вакансию по id (только своя)
      operationId: getVacancy
      parameters:
        - $ref: '#/components/parameters/VacancyId'
      responses:
        '200':
          description: Вакансия
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vacancy'
        '401':
          description: Не авторизован
        '403':
          description: Вакансия принадлежит другому работодателю
        '404':
          description: Вакансия не найдена

  /api/vacancies/{id}/publish:
    post:
      summary: >
        Опубликовать вакансию (draft -> published): атомарный переход, сгенерировать и
        отправить карточку с кнопкой «Откликнуться» в MAX. При сбое отправки статус
        откатывается обратно в draft.
      operationId: publishVacancy
      parameters:
        - $ref: '#/components/parameters/VacancyId'
      responses:
        '200':
          description: Вакансия опубликована
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vacancy'
        '401':
          description: Не авторизован
        '403':
          description: Вакансия принадлежит другому работодателю
        '404':
          description: Вакансия не найдена
        '409':
          description: Вакансия уже опубликована или закрыта
        '502':
          description: Не удалось отправить карточку в MAX (статус откатан в draft), повторите попытку

  /api/vacancies/{id}/close:
    post:
      summary: Закрыть вакансию
      operationId: closeVacancy
      parameters:
        - $ref: '#/components/parameters/VacancyId'
      responses:
        '200':
          description: Вакансия закрыта
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vacancy'
        '401':
          description: Не авторизован
        '403':
          description: Вакансия принадлежит другому работодателю
        '404':
          description: Вакансия не найдена

  /api/vacancies/{id}/applications:
    get:
      summary: Список откликов по вакансии (воронка). Содержит контакты кандидатов — доступен только владельцу вакансии.
      operationId: listVacancyApplications
      parameters:
        - $ref: '#/components/parameters/VacancyId'
      responses:
        '200':
          description: Список откликов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Application'
        '401':
          description: Не авторизован
        '403':
          description: Вакансия принадлежит другому работодателю
        '404':
          description: Вакансия не найдена

  /api/applications:
    post:
      summary: Зафиксировать отклик авторизованного кандидата на опубликованную вакансию
      operationId: createApplication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationInput'
      responses:
        '201':
          description: Отклик создан (поле notified показывает, удалось ли уведомить работодателя в MAX)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '400':
          description: Ошибка валидации тела запроса
        '401':
          description: Не авторизован
        '404':
          description: Вакансия не найдена
        '409':
          description: Вакансия не опубликована, либо кандидат уже откликался на неё

  /api/applications/{id}:
    patch:
      summary: Сменить статус отклика (воронка) — только владелец вакансии
      operationId: updateApplicationStatus
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [new, contacted, invited, hired, rejected]
      responses:
        '200':
          description: Статус обновлён (поле notified показывает, удалось ли уведомить кандидата в MAX)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '400':
          description: Ошибка валидации тела запроса
        '401':
          description: Не авторизован
        '403':
          description: Вакансия принадлежит другому работодателю
        '404':
          description: Отклик не найден

  /api/benchmark:
    get:
      summary: Рыночный бенчмарк по зарплате (кэш, потом trudvsem.ru «Работа России»)
      operationId: getBenchmark
      security: []
      parameters:
        - name: region_code
          in: query
          required: true
          schema:
            type: string
        - name: category
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Бенчмарк
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Benchmark'
        '400':
          description: Не переданы обязательные параметры
        '404':
          description: Данных по бенчмарку нет

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        Токен из POST /api/auth/max, либо значение TEST_API_TOKEN (переменная окружения backend)
        для тестирования без реального MAX-логина. Заголовок: Authorization: Bearer <token>.

  parameters:
    VacancyId:
      name: id
      in: path
      required: true
      schema:
        type: integer

  schemas:
    Vacancy:
      type: object
      properties:
        id:
          type: integer
        employerUserId:
          type: integer
        title:
          type: string
        regionCode:
          type: string
        category:
          type: string
        schedule:
          type: string
          enum: [seasonal, temporary, permanent]
        salaryMin:
          type: integer
          nullable: true
        salaryMax:
          type: integer
          nullable: true
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [draft, published, closed]
        cardMessageId:
          type: string
          nullable: true
        employerChatId:
          type: string
          nullable: true
          description: >
            Чат MAX, застывший в момент публикации/создания — именно сюда уходят все будущие
            уведомления по этой вакансии, независимо от того, из какого чата работодатель
            пишет боту позже.
        createdAt:
          type: string
          format: date-time

    VacancyInput:
      type: object
      required: [title]
      description: employer_id больше не передаётся — работодатель определяется по Bearer-токену.
      properties:
        title:
          type: string
        region_code:
          type: string
        category:
          type: string
        schedule:
          type: string
          enum: [seasonal, temporary, permanent]
        salary_min:
          type: integer
          nullable: true
        salary_max:
          type: integer
          nullable: true
        description:
          type: string
          nullable: true

    Application:
      type: object
      properties:
        id:
          type: integer
        vacancyId:
          type: integer
        candidateUserId:
          type: integer
        status:
          type: string
          enum: [new, contacted, invited, hired, rejected]
        contact:
          type: string
          nullable: true
        candidateChatId:
          type: string
          nullable: true
          description: Чат MAX, застывший в момент отклика — сюда уходят уведомления о смене статуса.
        notified:
          type: boolean
          description: >
            Только в ответе POST /api/applications и PATCH /api/applications/{id} — удалось ли
            отправить уведомление в MAX. false не означает ошибку запроса: данные уже сохранены,
            просто сообщение в MAX не доставилось (см. notifyError в логах backend).
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ApplicationInput:
      type: object
      required: [vacancy_id]
      description: candidate_user_id больше не передаётся — кандидат определяется по Bearer-токену.
      properties:
        vacancy_id:
          type: integer
        contact:
          type: string
          nullable: true

    Benchmark:
      type: object
      properties:
        avgSalaryMin:
          type: integer
          nullable: true
        avgSalaryMax:
          type: integer
          nullable: true
        vacancyCount:
          type: integer
        isFresh:
          type: boolean

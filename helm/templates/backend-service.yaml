{{- $ctx := dict "root" . "component" "backend" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "helm.componentName" $ctx }}
  labels:
    {{- include "helm.labels" $ctx | nindent 4 }}
spec:
  type: {{ .Values.backend.service.type }}
  selector:
    {{- include "helm.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
